name: agri-price-crawler-v2

x-backend-v2: &backend-v2
  image: agri-price-crawler-v2:local
  build:
    context: .
    dockerfile: Dockerfile.v2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agri
      POSTGRES_USER: agri
      POSTGRES_PASSWORD: agri_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri -d agri"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *backend-v2
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://agri:agri_dev@postgres:5432/agri?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *backend-v2
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://agri:agri_dev@postgres:5432/agri?sslmode=disable
      REDIS_ADDR: redis:6379
      IDENTITY_JWT_PRIVATE_KEY_BASE64: ${IDENTITY_JWT_PRIVATE_KEY_BASE64:-}
      IDENTITY_OTP_PEPPER_BASE64: ${IDENTITY_OTP_PEPPER_BASE64:-}
      IDENTITY_EMAIL_DRIVER: memory
      IDENTITY_WECHAT_APP_ID: wx-local-development
      IDENTITY_WECHAT_APP_SECRET: local-placeholder-not-a-secret
      IDENTITY_WEB_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/livez && wget -q -O /dev/null http://localhost:8080/readyz",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend-v2
    entrypoint: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://agri:agri_dev@postgres:5432/agri?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_v2_data:
